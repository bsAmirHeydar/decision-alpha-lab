name: UC-02 Authority Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: uc02-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pyyaml jsonschema pytest
      - name: Verify frozen UC-02 static contracts
        run: python -m tools.consolidation.uc02.cli verify-static-patch --repo-root .
      - name: Verify migration-aware authority continuity
        run: python -m tools.consolidation.ci.verify_migration_continuity --repo-root .
      - name: Run UC-02 conformance tests
        run: python -m pytest -q tests/consolidation/uc02 tests/consolidation/ci
