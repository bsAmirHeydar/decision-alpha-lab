name: UC03 Part2 Topology

on:
  pull_request:
  push:
    branches: [main]

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m tools.consolidation.uc03p2.verify --repo-root .
