name: Engineering Policy

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: engineering-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the same preflight used locally
        run: python tools/engineering/run_engineering_policy.py .
