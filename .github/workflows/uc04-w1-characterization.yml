name: UC04 W1 Characterization

on:
  pull_request:
    paths:
      - '.github/workflows/uc04-w1-characterization.yml'
      - '.gitattributes'
      - 'mql5/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - 'registry/consolidation/uc04/w0/**'
      - 'registry/consolidation/uc04/w1/**'
      - 'releases/unified_consolidation/uc04/w0/**'
      - 'releases/unified_consolidation/uc04/w1/**'
      - 'schemas/consolidation/uc04/**'
      - 'tests/consolidation/uc04w0/**'
      - 'tests/consolidation/uc04w1/**'
      - 'tests/fixtures/consolidation/uc04w1/**'
      - 'tools/consolidation/ci/portable_hash.py'
      - 'tools/consolidation/uc04w0/**'
      - 'tools/consolidation/uc04w1/**'
      - 'tools/repository_paths.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/uc04-w1-characterization.yml'
      - '.gitattributes'
      - 'mql5/**'
      - 'pytest.ini'
      - 'requirements.txt'
      - 'registry/consolidation/uc04/w0/**'
      - 'registry/consolidation/uc04/w1/**'
      - 'releases/unified_consolidation/uc04/w0/**'
      - 'releases/unified_consolidation/uc04/w1/**'
      - 'schemas/consolidation/uc04/**'
      - 'tests/consolidation/uc04w0/**'
      - 'tests/consolidation/uc04w1/**'
      - 'tests/fixtures/consolidation/uc04w1/**'
      - 'tools/consolidation/ci/portable_hash.py'
      - 'tools/consolidation/uc04w0/**'
      - 'tools/consolidation/uc04w1/**'
      - 'tools/repository_paths.py'

permissions:
  contents: read

concurrency:
  group: uc04-w1-characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # W1 verifies the accepted W0 LFS-pointer boundary before characterization.
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Run engineering policy
        run: python tools/engineering/run_engineering_policy.py .
      - name: Verify accepted upstream foundation
        run: python -m tools.consolidation.uc04w0.verify --repo-root . --skip-release-controls
      - name: Reproduce characterization records
        run: python -m tools.consolidation.uc04w1.characterize --repo-root .
      - name: Verify W1A governance and release
        run: python -m tools.consolidation.uc04w1.verify --repo-root .
      - name: Run W1A conformance tests
        run: python -m pytest -q tests/consolidation/uc04w1
      - name: Prove repository-wide collection integrity
        run: python -m pytest --collect-only -q
