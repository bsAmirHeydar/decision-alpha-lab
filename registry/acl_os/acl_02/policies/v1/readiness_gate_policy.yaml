version: 1.0.0
gates:
- gate_id: INTAKE_COMPLETE
  requires:
  - SCHEMA_CLOSED
  - NO_BLOCKING_MISSINGNESS
  - NO_PLACEHOLDERS
  - CLOCK_VALID
  - SECURITY_CLASSIFIED
  - AUTHORITY_BOUND
- gate_id: SEMANTIC_REVIEW
  requires:
  - INTAKE_COMPLETE
  - SEMANTIC_OWNER_REVIEW
  - COUNTEREXAMPLE_REVIEW
- gate_id: SEMANTICALLY_VALIDATED
  requires:
  - SEMANTIC_REVIEW
  - ACL00_TRANSITION_APPROVAL
acl02_maximum_state: SEMANTICALLY_VALIDATED
forbidden_claims:
- REAL_ALPHA
- MODEL_PROMOTION
- LIVE_PARITY
- CAPITAL_AUTHORIZATION
