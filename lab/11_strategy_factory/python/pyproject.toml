[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="decision-alpha-lab-strategy-factory"
version="0.10.0"
description="MQL5-first Strategy Factory through Strategy Tester research harness and pass selection"
requires-python=">=3.10"
[tool.setuptools.packages.find]
where=["."]
include=["strategy_factory_contracts*","strategy_factory_runtime*","strategy_factory_market*","strategy_factory_plugins*","strategy_factory_generation*","strategy_factory_anatomy*","strategy_factory_context*","strategy_factory_candidate*","strategy_factory_outcome*","strategy_factory_research*"]
