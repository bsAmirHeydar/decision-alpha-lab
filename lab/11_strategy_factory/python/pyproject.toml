[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="decision-alpha-lab-strategy-factory"
version="0.17.0"
description="MQL5-first Strategy Factory through deterministic paper and shadow execution"
requires-python=">=3.10"
[project.scripts]
strategy-factory-statistics="strategy_factory_statistics.cli:main"
strategy-factory-validation="strategy_factory_validation.cli:main"
strategy-factory-training="strategy_factory_training.cli:main"
strategy-factory-governance="strategy_factory_governance.cli:main"
strategy-factory-inference="strategy_factory_inference.cli:main"
strategy-factory-decision="strategy_factory_decision.cli:main"
strategy-factory-execution="strategy_factory_execution.cli:main"
[tool.setuptools.packages.find]
where=["."]
include=["strategy_factory_contracts*","strategy_factory_runtime*","strategy_factory_market*","strategy_factory_plugins*","strategy_factory_generation*","strategy_factory_anatomy*","strategy_factory_context*","strategy_factory_candidate*","strategy_factory_outcome*","strategy_factory_research*","strategy_factory_statistics*","strategy_factory_validation*","strategy_factory_training*","strategy_factory_governance*","strategy_factory_inference*","strategy_factory_decision*","strategy_factory_execution*"]
