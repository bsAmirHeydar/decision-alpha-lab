[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="decision-alpha-lab-strategy-factory"
version="0.37.0"
description="MQL5-first Strategy Factory with UCEE v3 governance and SAED V4-07 bounded deterministic action lattice"
requires-python=">=3.10"
[project.scripts]
strategy-factory-statistics="strategy_factory_statistics.cli:main"
strategy-factory-validation="strategy_factory_validation.cli:main"
strategy-factory-training="strategy_factory_training.cli:main"
strategy-factory-governance="strategy_factory_governance.cli:main"
strategy-factory-inference="strategy_factory_inference.cli:main"
strategy-factory-decision="strategy_factory_decision.cli:main"
strategy-factory-execution="strategy_factory_execution.cli:main"
strategy-factory-live="strategy_factory_live.cli:main"
strategy-factory-monitoring="strategy_factory_monitoring.cli:main"
strategy-factory-integration="strategy_factory_integration.cli:main"
strategy-factory-contracts-v3="strategy_factory_contracts_v3.cli:main"
strategy-factory-contexts-v3="strategy_factory_contexts_v3.cli:main"
strategy-factory-treatments-v3="strategy_factory_treatments_v3.cli:main"
strategy-factory-treatment-compiler-v3="strategy_factory_treatment_compiler_v3.cli:main"
strategy-factory-economics-v3="strategy_factory_economics_v3.cli:main"
strategy-factory-dataset-v3="strategy_factory_dataset_v3.cli:main"
strategy-factory-trainers-v3="strategy_factory_trainers_v3.cli:main"
strategy-factory-classical-v3="strategy_factory_classical_v3.cli:main"
strategy-factory-advanced-tasks-v3="strategy_factory_advanced_tasks_v3.cli:main"
strategy-factory-deep-views-v3="strategy_factory_deep_views_v3.cli:main"
strategy-factory-experiments-v3="strategy_factory_experiments_v3.cli:main"
strategy-factory-promotion-v3="strategy_factory_promotion_v3.cli:main"
strategy-factory-policy-v3="strategy_factory_policy_v3.cli:main"
strategy-factory-runtime-v3="strategy_factory_runtime_v3.cli:main"
strategy-factory-tournament-v3="strategy_factory_tournament_v3.cli:main"
saed-v4-hypergraph="saed_v4_semantic_hypergraph.cli:main"
saed-v4-treatment-dsl="saed_v4_treatment_dsl.cli:main"
saed-v4-action-lattice="saed_v4_action_lattice.cli:main"
[tool.setuptools.packages.find]
where=["."]
include=["strategy_factory_contracts*","strategy_factory_runtime*","strategy_factory_market*","strategy_factory_plugins*","strategy_factory_generation*","strategy_factory_anatomy*","strategy_factory_context*","strategy_factory_candidate*","strategy_factory_outcome*","strategy_factory_research*","strategy_factory_statistics*","strategy_factory_validation*","strategy_factory_training*","strategy_factory_governance*","strategy_factory_inference*","strategy_factory_decision*","strategy_factory_execution*","strategy_factory_live*","strategy_factory_monitoring*","strategy_factory_integration*","strategy_factory_contracts_v3*","strategy_factory_contexts_v3*","strategy_factory_treatments_v3*","strategy_factory_treatment_compiler_v3*","strategy_factory_economics_v3*","strategy_factory_dataset_v3*","strategy_factory_trainers_v3*","strategy_factory_classical_v3*","strategy_factory_advanced_tasks_v3*","strategy_factory_deep_views_v3*","strategy_factory_experiments_v3*","strategy_factory_promotion_v3*","strategy_factory_policy_v3*","strategy_factory_runtime_v3*","strategy_factory_tournament_v3*","saed_v4_semantic_hypergraph*","saed_v4_treatment_dsl*","saed_v4_action_lattice*"]

[project.optional-dependencies]
ucee-classical=["numpy>=1.26","scikit-learn>=1.4","scipy>=1.11"]
ucee-boosters=["xgboost>=2.0","lightgbm>=4.0","catboost>=1.2"]
ucee-interpretability=["shap>=0.45"]
ucee-classical-all=["numpy>=1.26","scikit-learn>=1.4","scipy>=1.11","xgboost>=2.0","lightgbm>=4.0","catboost>=1.2","shap>=0.45"]

ucee-advanced-survival=["lifelines>=0.29","scikit-survival>=0.23"]
ucee-advanced-ranking=["lightgbm>=4.0","xgboost>=2.0"]
ucee-advanced-policy=["numpy>=1.26","scipy>=1.11"]

ucee-deep=["numpy>=1.26","torch>=2.2"]
ucee-graph=["numpy>=1.26","torch>=2.2","torch-geometric>=2.5"]
ucee-onnx=["onnx>=1.16","onnxruntime>=1.17"]
ucee-deep-all=["numpy>=1.26","torch>=2.2","torch-geometric>=2.5","onnx>=1.16","onnxruntime>=1.17"]
