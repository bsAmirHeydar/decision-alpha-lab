schema_version: 1.0.0
required_columns:
- time
- open
- high
- low
- close
optional_columns:
  volume: 0
accepted_time_aliases:
- time
- time_utc
- datetime
- date
numeric_coercion:
- open
- high
- low
- close
- volume
