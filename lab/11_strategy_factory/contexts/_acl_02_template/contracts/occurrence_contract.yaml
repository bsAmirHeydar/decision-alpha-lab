identity_fields:
- context_id
- context_version
- anchor_time
- direction
- subject_key
start_rule: REPLACE_ME_WITH_DETERMINISTIC_START_RULE
confirmation_rule: REPLACE_ME_WITH_DETERMINISTIC_CONFIRMATION_RULE
invalidation_rule: REPLACE_ME_WITH_DETERMINISTIC_INVALIDATION_RULE
expiry_rule: REPLACE_ME_WITH_DETERMINISTIC_EXPIRY_RULE
deduplication_rule: REPLACE_ME_WITH_CONTENT_AND_TIME_BASED_DEDUPLICATION_RULE
revision_policy: APPEND_NEW_REVISION
precedence:
- INVALIDATION_BEFORE_CONFIRMATION_WHEN_SAME_KNOWN_TIME
- EXPIRY_AFTER_ALL_SAME_TIME_EVENTS
