allowed_inputs: [RTHP_EVENT_VIEW, RTHP_REFERENCE_STATE_VIEW, cycle_definition_version, signal_family]
allowed_outputs: [frequency_report, forward_outcome_report, confidence_interval, walk_forward_report, multiple_testing_report]
