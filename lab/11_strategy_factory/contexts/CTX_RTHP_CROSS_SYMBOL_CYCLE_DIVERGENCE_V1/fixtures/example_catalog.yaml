examples:
- example_id: AMB_STALE_PRIMARY
  kind: AMBIGUOUS
  fixture_ref: fixtures/golden/AMB_STALE_PRIMARY.json
  known_time_annotation: Missing synchronized primary data transitions the Context to UNCONFIRMED.
  expected_classification: UNCONFIRMED_STALE_PRIMARY
- example_id: AMB_STALE_SECONDARY
  kind: AMBIGUOUS
  fixture_ref: fixtures/golden/AMB_STALE_SECONDARY.json
  known_time_annotation: Missing synchronized secondary data transitions the Context to UNCONFIRMED.
  expected_classification: UNCONFIRMED_STALE_SECONDARY
- example_id: NEG_BASIS_MISMATCH
  kind: NEGATIVE
  fixture_ref: fixtures/golden/NEG_BASIS_MISMATCH.json
  known_time_annotation: A basis mismatch has no detector transition and cannot create an occurrence.
  expected_classification: INVALID_PRICE_BASIS_MISMATCH
- example_id: NEG_BOTH_HIGH
  kind: NEGATIVE
  fixture_ref: fixtures/golden/NEG_BOTH_HIGH.json
  known_time_annotation: The protected High is touched before confirmation, terminating in BOTH_SIDES_TOUCHED.
  expected_classification: NO_EVENT_BOTH_TOUCHED
- example_id: NEG_NONE_LOW
  kind: NEGATIVE
  fixture_ref: fixtures/golden/NEG_NONE_LOW.json
  known_time_annotation: No touch transition is available at the synchronized cut; state remains UNTOUCHED_BOTH.
  expected_classification: NO_EVENT_NONE_TOUCHED
- example_id: NONSEQUENTIAL_M15
  kind: POSITIVE
  fixture_ref: fixtures/golden/NONSEQUENTIAL_M15.json
  known_time_annotation: Non-sequential M15 relationship follows the same canonical state path with distinct cycle identity.
  expected_classification: CONFIRMED_NONSEQUENTIAL_M15
- example_id: PARTIAL_HISTORY
  kind: POSITIVE
  fixture_ref: fixtures/golden/PARTIAL_HISTORY.json
  known_time_annotation: Partial but nonzero reference history may confirm while carrying partial sufficiency metadata.
  expected_classification: CONFIRMED_PARTIAL_HISTORY
- example_id: POS_HIGH_A_ONLY
  kind: POSITIVE
  fixture_ref: fixtures/golden/POS_HIGH_A_ONLY.json
  known_time_annotation: One High-side touch followed by synchronized exclusive-or confirmation.
  expected_classification: CONFIRMED_BEARISH_DIVERGENCE
- example_id: POS_LOW_B_ONLY
  kind: POSITIVE
  fixture_ref: fixtures/golden/POS_LOW_B_ONLY.json
  known_time_annotation: One Low-side touch followed by synchronized exclusive-or confirmation.
  expected_classification: CONFIRMED_BULLISH_DIVERGENCE
- example_id: RESTART_DEDUP
  kind: POSITIVE
  fixture_ref: fixtures/golden/RESTART_DEDUP.json
  known_time_annotation: A repeated confirmation after the immutable occurrence does not create another transition.
  expected_classification: CONFIRMED_RESTART_DEDUP
- example_id: SEQUENTIAL_M15
  kind: POSITIVE
  fixture_ref: fixtures/golden/SEQUENTIAL_M15.json
  known_time_annotation: Sequential M15 relationship follows the first-touch and confirmation path.
  expected_classification: CONFIRMED_SEQUENTIAL_M15
- example_id: ZERO_HISTORY
  kind: NEGATIVE
  fixture_ref: fixtures/golden/ZERO_HISTORY.json
  known_time_annotation: Zero reference history has no confirmation transition and remains unconfirmed at the detector level.
  expected_classification: INSUFFICIENT_HISTORY
minimum_per_class: 1
counterexample_policy: Every semantic amendment must add or update positive, negative, and ambiguous immutable fixtures before
  approval.
