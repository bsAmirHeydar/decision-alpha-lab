ancestry:
- lab/11_strategy_factory/contexts/CTX_RTHP_CROSS_SYMBOL_CYCLE_DIVERGENCE_V1/intake/source/RTHP_RAW_CONTEXT.docx
- lab/11_strategy_factory/contexts/CTX_RTHP_CROSS_SYMBOL_CYCLE_DIVERGENCE_V1/intake/owner_decision_registry.json
reference_types:
- type_id: CYCLE_HIGH
  identity_rule: Cycle occurrence identity plus symbol identity plus HIGH side.
  validity_rule: Eligible until a protected-symbol High touch records REFERENCE_EXHAUSTED in the same family, pair, and reference-cycle scope.
- type_id: CYCLE_LOW
  identity_rule: Cycle occurrence identity plus symbol identity plus LOW side.
  validity_rule: Eligible until a protected-symbol Low touch records REFERENCE_EXHAUSTED in the same family, pair, and reference-cycle scope.
lifecycle_policy: High and Low references are independent, family scopes are independent, repeated hunter touches do not consume the paired level, and exhaustion never deletes historical occurrences.
retirement_policy: Exhausted references receive an immutable tombstone state and cannot be silently reused for later occurrences in the same scoped identity.
