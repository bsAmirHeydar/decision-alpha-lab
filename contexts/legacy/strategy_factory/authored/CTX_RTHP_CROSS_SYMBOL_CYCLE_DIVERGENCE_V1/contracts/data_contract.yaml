synchronization: Both symbols must expose observations whose M15 confirmation-close identity is equal; earlier observations are quarantined as stale evidence and cannot confirm an occurrence.
precision_policy: Normalize each observed price and its symbol-local reference price to the registered tick size; additional touch tolerance is exactly zero ticks.
revision_policy: APPEND_ONLY
corporate_action_policy: NOT_APPLICABLE_TO_GENERIC_SYMBOL_PAIR_UNLESS_A_VERSIONED_ADAPTER_DECLARATION_OVERRIDES_THIS_POLICY
data_retention: Preserve source artifact references, observation hashes, first-touch evidence, confirmation cuts, and append-only correction lineage for deterministic replay.
