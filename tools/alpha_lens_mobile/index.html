<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8f3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Alpha Lens" />
  <title>Alpha Lens Ultra</title>
  <link rel="manifest" href="./manifest.webmanifest?v=ultra4" />
  <link rel="stylesheet" href="./styles.css?v=ultra4" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">Alpha Lens</div>
        <div class="sub">Ultra minimal · v4</div>
      </div>
      <button id="resetBtn" class="ghost" type="button">ریست</button>
    </header>

    <section class="meta">
      <input id="symbolInput" placeholder="XAUUSD" />
      <input id="sessionInput" placeholder="Session" />
      <select id="finalBias">
        <option value="نامشخص">Bias?</option>
        <option value="صعودی">صعودی</option>
        <option value="نزولی">نزولی</option>
        <option value="دوطرفه">دوطرفه</option>
        <option value="No Trade">No Trade</option>
      </select>
    </section>

    <textarea id="globalContext" class="context" rows="1" placeholder="کانتکس در یک جمله…"></textarea>

    <section class="matrix-card" aria-label="Alpha Lens Matrix">
      <table class="matrix">
        <thead>
          <tr>
            <th></th>
            <th>1H</th>
            <th>10M</th>
            <th>1M</th>
          </tr>
        </thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </section>

    <section class="editor" id="editor">
      <div class="editor-title">
        <span id="activeTitle">—</span>
        <span id="activeRole">—</span>
      </div>
      <div class="controls">
        <select id="riskInput">
          <option value="—">Risk</option>
          <option value="Low">Risk L</option>
          <option value="Medium">Risk M</option>
          <option value="High">Risk H</option>
        </select>
        <select id="rewardInput">
          <option value="—">Reward</option>
          <option value="Low">Reward L</option>
          <option value="Medium">Reward M</option>
          <option value="High">Reward H</option>
          <option value="Open">Reward Open</option>
        </select>
        <select id="actionInput">
          <option value="Empty">Empty</option>
          <option value="No Trade">No</option>
          <option value="Watch">Watch</option>
          <option value="Wait for Child">Wait</option>
          <option value="Limit Ready">Limit</option>
          <option value="Manage">Manage</option>
        </select>
        <input id="scoreInput" type="number" min="0" max="100" inputmode="numeric" placeholder="Score" />
      </div>
      <textarea id="notesInput" rows="1" placeholder="دلیل کوتاه…"></textarea>
    </section>

    <section class="final">
      <select id="finalAction">
        <option value="Watch">Watch</option>
        <option value="Wait for Child">Wait</option>
        <option value="Limit Ready">Limit</option>
        <option value="Manage">Manage</option>
        <option value="No Trade">No Trade</option>
      </select>
      <input id="finalNotes" placeholder="تصمیم نهایی…" />
    </section>

    <nav class="actions">
      <button id="saveSnapshotBtn" type="button">Snap</button>
      <button id="exportBtn" type="button">Export</button>
      <label>Import<input id="importInput" type="file" accept="application/json" hidden /></label>
    </nav>

    <details class="snaps">
      <summary>Snapshotها</summary>
      <div id="snapshotsList"></div>
      <button id="clearSnapshotsBtn" type="button" class="danger">حذف همه</button>
    </details>
  </main>

  <script src="./app.js?v=ultra4"></script>
</body>
</html>
