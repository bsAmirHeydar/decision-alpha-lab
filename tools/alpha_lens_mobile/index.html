<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Alpha Lens" />
  <title>Alpha Lens</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="kicker">Alpha Lens</p>
        <h1>ماتریس نگاه بازار</h1>
      </div>
      <button id="resetBtn" class="icon-btn danger" type="button" aria-label="ریست">↺</button>
    </header>

    <section class="top-strip" aria-label="اطلاعات کلی">
      <input id="symbolInput" type="text" placeholder="XAUUSD" autocomplete="off" />
      <input id="sessionInput" type="text" placeholder="Session" autocomplete="off" />
      <select id="finalBias" aria-label="Bias نهایی">
        <option value="نامشخص">Bias?</option>
        <option value="صعودی">صعودی</option>
        <option value="نزولی">نزولی</option>
        <option value="دوطرفه">دوطرفه</option>
        <option value="No Trade">No Trade</option>
      </select>
    </section>

    <section class="context-card">
      <textarea id="globalContext" rows="2" placeholder="کانتکس کوتاه امروز…"></textarea>
    </section>

    <section class="matrix-wrap">
      <div class="tf-head">
        <span></span>
        <b>1H</b>
        <b>10M</b>
        <b>1M</b>
      </div>
      <div id="matrix" class="matrix" aria-label="Alpha Lens Compact Matrix"></div>
    </section>

    <section class="editor" aria-label="ویرایش سلول انتخاب‌شده">
      <div class="editor-head">
        <div>
          <p class="micro">سلول فعال</p>
          <h2 id="activeTitle">—</h2>
        </div>
        <span id="activeRole" class="pill">—</span>
      </div>

      <div class="compact-grid">
        <label>
          <span>Risk</span>
          <select id="riskInput">
            <option value="—">—</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </label>
        <label>
          <span>Reward</span>
          <select id="rewardInput">
            <option value="—">—</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Open">Open</option>
          </select>
        </label>
        <label>
          <span>Action</span>
          <select id="actionInput">
            <option value="Empty">Empty</option>
            <option value="No Trade">No Trade</option>
            <option value="Watch">Watch</option>
            <option value="Wait for Child">Wait</option>
            <option value="Limit Ready">Limit</option>
            <option value="Manage">Manage</option>
          </select>
        </label>
        <label>
          <span>Score</span>
          <input id="scoreInput" type="number" min="0" max="100" inputmode="numeric" placeholder="0" />
        </label>
      </div>

      <textarea id="notesInput" class="note" rows="2" placeholder="دلیل خیلی کوتاه: هزینه؟ ریوارد؟ زون؟"></textarea>
    </section>

    <section class="decision-card">
      <div class="decision-row">
        <select id="finalAction" aria-label="اکشن نهایی">
          <option value="Watch">Watch</option>
          <option value="Wait for Child">Wait</option>
          <option value="Limit Ready">Limit</option>
          <option value="Manage">Manage</option>
          <option value="No Trade">No Trade</option>
        </select>
        <textarea id="finalNotes" rows="1" placeholder="تصمیم نهایی در یک جمله…"></textarea>
      </div>
    </section>

    <nav class="bottom-actions" aria-label="عملیات">
      <button id="saveSnapshotBtn" type="button">Snapshot</button>
      <button id="exportBtn" type="button">Export</button>
      <label class="upload-btn">Import<input id="importInput" type="file" accept="application/json" hidden /></label>
    </nav>

    <details class="snapshots-box">
      <summary>Snapshotها</summary>
      <div id="snapshotsList" class="snapshots-list"></div>
      <button id="clearSnapshotsBtn" class="small-danger" type="button">حذف همه</button>
    </details>
  </main>

  <script src="./app.js"></script>
</body>
</html>
