<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alpha Lens" />
  <title>Alpha Lens Matrix</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Decision Alpha Lab</p>
        <h1>Alpha Lens Matrix</h1>
        <p class="subtitle">چهار منظر × سه تایم‌فریم — ریسک، ریوارد، اکشن</p>
      </div>
      <button id="resetBtn" class="ghost danger" type="button">ریست</button>
    </header>

    <section class="today-card">
      <label>
        نماد
        <input id="symbolInput" type="text" placeholder="XAUUSD" autocomplete="off" />
      </label>
      <label>
        تاریخ / سشن
        <input id="sessionInput" type="text" placeholder="مثلاً NY AM" autocomplete="off" />
      </label>
      <label class="wide">
        کانتکس کلی امروز
        <textarea id="globalContext" rows="2" placeholder="مثلاً H1 فشرده، 10M نزولی ضعیف، منتظر زون صعودی…"></textarea>
      </label>
    </section>

    <section class="legend">
      <span><b>Risk</b>: هزینه/عرض/ابهام</span>
      <span><b>Reward</b>: فضای باز/انفجار</span>
      <span><b>Action</b>: تصمیم عملی</span>
    </section>

    <section id="matrix" class="matrix" aria-label="Alpha Lens Matrix"></section>

    <section class="decision-panel">
      <h2>تصمیم نهایی</h2>
      <div class="decision-grid">
        <label>
          Bias نهایی
          <select id="finalBias">
            <option value="نامشخص">نامشخص</option>
            <option value="صعودی">صعودی</option>
            <option value="نزولی">نزولی</option>
            <option value="دوطرفه">دوطرفه</option>
            <option value="No Trade">No Trade</option>
          </select>
        </label>
        <label>
          وضعیت
          <select id="finalAction">
            <option value="Watch">Watch</option>
            <option value="Wait for Child">Wait for Child</option>
            <option value="Limit Ready">Limit Ready</option>
            <option value="Manage">Manage</option>
            <option value="No Trade">No Trade</option>
          </select>
        </label>
      </div>
      <label>
        دلیل تصمیم
        <textarea id="finalNotes" rows="3" placeholder="چرا معامله می‌کنم یا نمی‌کنم؟ زون کجاست؟ ریسک چرا ارزش دارد؟"></textarea>
      </label>
    </section>

    <section class="actions">
      <button id="saveSnapshotBtn" class="primary" type="button">ذخیره Snapshot</button>
      <button id="exportBtn" class="ghost" type="button">خروجی JSON</button>
      <label class="import-label ghost">
        ورود JSON
        <input id="importInput" type="file" accept="application/json" hidden />
      </label>
    </section>

    <section class="snapshots">
      <div class="snapshots-head">
        <h2>Snapshotها</h2>
        <button id="clearSnapshotsBtn" class="ghost danger" type="button">حذف همه</button>
      </div>
      <div id="snapshotsList" class="snapshots-list"></div>
    </section>
  </main>

  <template id="cellTemplate">
    <article class="cell-card">
      <div class="cell-title"></div>
      <div class="field-row">
        <label>
          Risk
          <select class="risk">
            <option value="—">—</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </label>
        <label>
          Reward
          <select class="reward">
            <option value="—">—</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Open">Open</option>
          </select>
        </label>
      </div>
      <label>
        Action
        <select class="action">
          <option value="Empty">Empty</option>
          <option value="No Trade">No Trade</option>
          <option value="Watch">Watch</option>
          <option value="Wait for Child">Wait for Child</option>
          <option value="Limit Ready">Limit Ready</option>
          <option value="Manage">Manage</option>
        </select>
      </label>
      <label>
        Score
        <input class="score" type="number" min="0" max="100" placeholder="0-100" inputmode="numeric" />
      </label>
      <label>
        Notes
        <textarea class="notes" rows="3" placeholder="هزینه، ریوارد، زون، دلیل…"></textarea>
      </label>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
